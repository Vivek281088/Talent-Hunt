<div class="pcrdetails">
  <div class="manageManagers-header">
    <div class="manageManagers-header-1">
      <div class="title">
        <p>PCR details</p>
      </div>
      <div class="header-breadcrumb">
        <p-breadcrumb
          class="BreadCrumb"
          [model]="items"
          [style]="{ border: 'none' }"
        ></p-breadcrumb>
      </div>
    </div>
    <div class="new-schedule-header-2">
      <div class="date">
        {{ todayDate | date }}
      </div>
    </div>
  </div>
  <div class="pcr-tab">
    <p-tabView styleClass="pcr-tab">
      <p-tabPanel>
        <ng-template pTemplate="header">
          <span class="pl-2">PCR details</span>
        </ng-template>
        <ng-template pTemplate="content">
            <div class="flex flex-wrap justify-content-around">
                <div class="gap-2 col-6 flex flex-column justify-content-between pcr-field" *ngFor="let field of inputFields; let i = index">
                  <label class="pcr-field-label" [for]="field.id">{{ field.label }}</label>
                  <input pInputText
                    [id]="field.id"
                    type="text"
                    [disabled]="true"
                    [value]="field.value"
                    class="pcr-field-input text-base text-color surface-overlay p-2 border-1 border-solid surface-border border-round appearance-none outline-none focus:border-primary w-25rem small-input"
                  />
                </div>
              </div>
              
        </ng-template>
      </p-tabPanel>
      <p-tabPanel header="Header II">
        <ng-template pTemplate="header">
          <span class="pl-2">PCR_EMP Mapping</span>
        </ng-template>
      <ng-template pTemplate="content">
        
<div class="card">
    <p-table  [value]="pcrTableData.data" #dt1 styleClass="p-datatable-striped" [tableStyle]="{'min-width': '50rem'}">
        <ng-template pTemplate="header" >
            <tr>
                <th colspan="8">
                  <div class="manager-header">
                    <div class="manager-header1">
                      <div class="p-input-icon-right">
                        <i class="pi pi-search"></i>
                        <input
                          class="searchIcon"
                          pInputText
                          type="text"
                          (input)="
                            dt1.filterGlobal($any($event.target).value, 'contains')
                          "
                          placeholder="Search"
                        />
                      </div>
                     
                    </div>
                    
                  </div>
                </th>
              </tr>
            <tr >
                <th *ngFor="let header of pcrTableData.headers">{{header.title}}</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-emp>
            <tr>
                <td>{{emp.Project_id}}</td>
                <td>{{emp.CreatedBy}}</td>
                <td>{{emp.Jobtitle}}</td>
                <td>{{emp.PCRstatus}}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
      </ng-template>
      </p-tabPanel>
    </p-tabView>
  </div>
</div>

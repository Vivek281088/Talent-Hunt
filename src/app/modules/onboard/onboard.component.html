<div>
  <div class="title">
    <p>PCR</p>
    <div class="header-breadcrumb">
      <p-breadcrumb
        class="BreadCrumb"
        
        [style]="{ border: 'none' }"
      ></p-breadcrumb>
    </div>
  </div>
</div>

<div class="onboardingTable">
  <p-table [value]="filteredData" [scrollable]="true">
    <ng-template pTemplate="header">
      <tr>
        <th style="min-width: 50px" pFrozenColumn>
          Agile_ID
          <input
            type="text"
            placeholder="Filter by ID"
            (input)="filterData($event, 'id')"
          />
        </th>
        <th>
          Location
          <input
            type="text"
            placeholder="Filter by ID"
            (input)="filterData($event, 'id')"
          />
        </th>
        <th style="min-width: 50px" pFrozenColumn>
          PCR_ID
          <input
            type="text"
            placeholder="Filter by ID"
            (input)="filterData($event, 'id')"
          />
        </th>
  
        <th style="min-width: 150px" pFrozenColumn>
          Name
          <input
            type="text"
            placeholder="Filter by Name"
            (input)="filterData($event, 'name')"
          />
        </th>
        <th>
          DOB
          <input
            type="text"
            placeholder="Filter by DOB"
            (input)="filterData($event, 'dob')"
          />
        </th>
  
        <th>
          <p-dropdown
            [options]="employeeType"
            [showClear]="true"
            placeholder="Candidate Type"
            (onChange)="onTypeFilterChange($event)"
          ></p-dropdown>
        </th>
        <th>Resume</th>
        <th *ngFor="let key of getAllKeys()">
          <ng-container *ngIf="key !== 'id' && key !== 'name'">
            {{ key }}
          </ng-container>
        </th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td pFrozenColumn>{{ item.id }}</td>
        <td>Onsite/Offshore</td>
        <td pFrozenColumn>{{ item.id }}</td>
        <td pFrozenColumn>{{ item.name }}</td>
        <td>{{ item.dob }}</td>
  
        <td>Exp/Contractor</td>
        <td>
          <a href="">UnAvaliable</a>
        </td>
  
        <td *ngFor="let key of getAllKeys()">
          <ng-container *ngIf="key !== 'id' && key !== 'name'">
            <input
              type="checkbox"
              [name]="key"
              [id]="'chk-' + item.name + '-' + key"
              (change)="handleCheckboxChange($event, item.name, key)"
            />
          </ng-container>
        </td>
      </tr>
    </ng-template>
  </p-table>
  
</div>

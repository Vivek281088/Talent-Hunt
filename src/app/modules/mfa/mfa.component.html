
<div class="flex justify-content-center"(keydown.enter)="onEnterKey()">
  
    <p-dialog   [modal]="true" [(visible)]="visible"  [style]="{ width: '40%', 'height': 'fit-content' }" [draggable]="false" [resizable]="false" [closable]="true">
       <div class="dialog-body">
        <div class="logo-text">
        <img src="../assets\mphasis-logo.png" alt="Logo" width="100" />
        <p class="heading">MTalent</p>
    </div>
            <div>
                <ng-otp-input  (onInputChange)="onOtpChange($event)"   [config]="{length:6 , allowNumbersOnly:true}"></ng-otp-input>
            </div>
            <div class="verify-button">
                <p-toast></p-toast>
                
                <button  class="verify-button" (click)="verify()"> Verify Now</button>
            </div>
        </div> 
        <ng-template pTemplate="footer">
        </ng-template>
    </p-dialog>
</div>
